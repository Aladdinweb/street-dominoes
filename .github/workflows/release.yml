name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Version from tag
        id: v
        shell: bash
        run: |
          V="1.0.0-dev"; [ "$GITHUB_REF_TYPE" = "tag" ] && V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000+MI*100+PA))" >> "$GITHUB_OUTPUT"
      - name: Keystore
        shell: bash
        env: { KS_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/release.jks
          else
            keytool -genkeypair -keystore app/release.jks -alias street -keyalg RSA -keysize 2048 -validity 10000 -storepass streetdominoes -keypass streetdominoes -dname "CN=Street Dominoes, O=ILINE TECH"
            echo "::warning::No KEYSTORE_B64 secret - temporary key used. In-app updates will NOT install over this build."
          fi
      - name: Firebase config (push notifications)
        shell: bash
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
            echo "google-services.json written from the GOOGLE_SERVICES_B64 secret"
          else
            echo "::warning::GOOGLE_SERVICES_B64 secret not set - this APK is built without push notifications"
          fi
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk StreetDominoes-v${{ steps.v.outputs.name }}.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: StreetDominoes-v${{ steps.v.outputs.name }}.apk
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with: { name: apk, path: '*.apk' }
