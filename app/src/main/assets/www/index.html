const walk=(seq,f,lc,d)=>{for(const q of seq){
const hz=d%2===0,pos=d<2,len=q.d?S:L,th=q.d?L:S,a0=pos?f-o:f+o-len,e=pos?a0+len:a0;

else{const tp=pos?f-o:f+o-S,lf=nd===2?lc+S/2-L:lc-S/2;r={x:lf,y:tp,w:L,h:S};lc=tp+S/2;f=nd===2?lf:lf+L}

walk(chain.slice(0,ci).reverse().map(q=>({p:q.b,q:q.a,d:q.a===q.b})),cx-cw/2,cy,2);
