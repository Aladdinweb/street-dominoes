/* online panel: Casual Play / Coin Match are chosen by the player (default Casual, free); coins only when Coin Match is selected */
function modeHtml(){const x=t();if(onlineStake>coins)onlineStake=0;

function lobbyOpts(ol){const x=t();let h='';
if(ol.turn&&ol.auto!=='manual')h+=`<div class="mw">⏱ ${ol.turn}s · ${AUTOICON[ol.auto]||''} ${({play:x.auPlay,pass:x.auPass})[ol.auto]||''}</div>`;

/* ===== recent opponents (online and LAN) ===== */
const RCK='dm_recent',validPid=s=>/^usr_[a-z0-9]{4,20}$/.test(String(s||''));
const recents=()=>{try{const a=JSON.parse(localStorage.getItem(RCK)||'[]');return Array.isArray(a)?a.filter(r=>r&&validPid(r.id)).slice(0,20):[]}catch(e){return[]}};
function saveRecents(){let P=null;if(net.client)P=net.pids;else if(net.host)P=[pid,net.lp[1],net.lp[2],net.lp[3]];if(!P)return;
let list=recents();const now=Date.now();
for(let i=0;i<4;i++){const id=P[i];if(!validPid(id)||id===pid||seat[i]!==3)continue;list=list.filter(r=>r.id!==id);list.unshift({id,n:String(names[i]||'').slice(0,12),a:avs[i]|0,t:now})}
try{localStorage.setItem(RCK,JSON.stringify(list.slice(0,20)))}catch(e){}
if(typeof Pres!=='undefined')Pres.sync(true)}

/* ===== toast ===== */
function toast(txt){let e=document.getElementById('sdt');if(!e){e=document.createElement('div');e.id='sdt';document.body.appendChild(e)}
e.textContent=txt;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),3200)}

/* ===== presence (WebSocket to the server's presence Durable Object) ===== */
const Pres={ws:null,st:{},bo:0,cs:0,want:true,ka:0,
ids(){const s=new Set([...lbFriends(),...recents().map(r=>r.id)]);s.delete(pid);return[...s].slice(0,40)},
connect(){if(!Pres.want||typeof WebSocket!=='function'||(Pres.ws&&Pres.ws.readyState<2))return;let w;
try{w=new WebSocket(ONLINE_URL+'?presence=1&pid='+encodeURIComponent(pid))}catch(e){return}Pres.ws=w;
w.onopen=()=>{Pres.bo=0;Pres.cs=0;Pres.wk='';Pres.sync(true);clearInterval(Pres.ka);Pres.ka=setInterval(()=>{try{if(w.readyState===1)w.send('ping')}catch(e){}},50000)};
w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
if(m.t==='pres'){if(m.all)Object.assign(Pres.st,m.all);else Pres.st[m.id]=m.s;Pres.changed()}else if(m.t==='inv')showInvite(m);else if(m.t==='invx')hideInvite(m.iid);else if(m.t==='invr')invResult(m)};
w.onclose=()=>{clearInterval(Pres.ka);if(Pres.ws===w)Pres.ws=null;for(const k in Pres.st)Pres.st[k]=0;Pres.changed();
if(Pres.want&&!document.hidden){Pres.bo=Math.min(60000,(Pres.bo||2000)*2);setTimeout(()=>Pres.connect(),Pres.bo)}}},
send(o){try{if(Pres.ws&&Pres.ws.readyState===1)Pres.ws.send(JSON.stringify(o))}catch(e){}},
sync(force){const cs=inGame?2:1;if(force||cs!==Pres.cs){Pres.cs=cs;Pres.send({t:'st',s:cs})}if(force){const ids=Pres.ids(),k=ids.join(',');if(k!==Pres.wk){Pres.wk=k;Pres.send({t:'watch',ids})}}},
count(){return lbFriends().filter(id=>Pres.st[id]>0).length},
onlineText(){const n=Pres.count();return n?`🟢 ${n} ${t().frOn}`:t().frHint},
changed(){const c=document.getElementById('frc');if(c)c.textContent=Pres.onlineText();if(frOpen())Pres.paint()},
paint(){if(Pres.pr)return;Pres.pr=requestAnimationFrame(()=>{Pres.pr=0;const x=t();document.querySelectorAll('#frm [data-fid]').forEach(r=>{const s=r.querySelector('.pst');if(!s)return;const st=Pres.st[r.dataset.fid]|0,v=['\uD83D\uDD18','\uD83D\uDFE2','\uD83D\uDFE1'][st]+' '+[x.frOff,x.frOn,x.frGame][st];if(s.textContent!==v)s.textContent=v})})}};

function invReply(iid,ok){if(!iid)return;try{postJ('/api/invite-response',{iid,pid,ok:ok?1:0}).catch(()=>{})}catch(e){}}

if(tg.id==='inx')e.hidden=true})}

e.innerHTML=`<div>${esc(m.ping||'\uD83D\uDC4B')} <b>${nm}</b> ${x.pingFrom}</div><button class="sm" id="inx">\u2715</button>`;
e.dataset.iid='';e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=true},6000);try{snd.win()}catch(er){}return}
const lab=({h2h:x.invH2H,partner:x.invPartner,tvt:x.invTvT})[m.type]||m.gm||'';
const prev=iid&&INVS[iid],fresh=!iid||!prev||(m.rep|0)>(prev.rep|0);
if(iid){if(prev)clearTimeout(prev.t);INVS[iid]={room:m.room,rep:m.rep|0,m,t:setTimeout(()=>hideInvite(iid),Math.max(2000,(m.ttl|0)||120000))}}
e.innerHTML=`<div>\uD83C\uDFB2 <b>${nm}</b> ${x.invFrom}<br><small>${esc(lab)}${m.stake?' \u00B7 \uD83E\uDE99 '+(m.stake|0):''}${m.turn?' \u00B7 \u23F1 '+(m.turn|0)+'s':''}</small></div><button class="big" data-ijoin="${esc(m.room)}" data-iid="${iid}">${x.invJoin}</button>${iid?`<button class="sm" data-idec="${iid}">${x.invDecline||'Decline'}</button>`:'<button class="sm" id="inx">\u2715</button>'}`;
e.dataset.iid=iid;e.hidden=false;
if(!iid){clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=true},25000)}
if(fresh){e.classList.remove('ring');void e.offsetWidth;e.classList.add('ring');try{snd.win()}catch(er){}}}

if(inGame){toast(t().invBusy);return}
for(const k of Object.keys(INVS))if(INVS[k].room===c){invReply(k,true);hideInvite(k)}
inMenu=false;setMode(3);net.lastc=c;net.oph='room';net.ol=null;net.msg='';onlineConnect({room:c});render()}
const postJ=(path,o)=>api2(path,{method:'POST',body:JSON.stringify(o)});
async function sendInvites(pi,room){const x=t();let r;try{r=await postJ('/api/invite',{from:pid,name:myName(),av:myAv(),to:pi.to,kind:'invite',room,gm:pi.gm,type:pi.type,stake:pi.stake,turn:pi.turn})}catch(e){toast(x.lbNoSrv);return}

const bits=[];if((j.delivered||[]).length)bits.push('🟢 '+j.delivered.length);if((j.pushed||[]).length)bits.push('🔔 '+j.pushed.length);if((j.offline||[]).length)bits.push('🔘 '+j.offline.length+' '+x.invOffline);if((j.limited||[]).length)bits.push('⏳ '+x.invLimited);

function openFr(){const x=t(),e=frEl(),sc0=(e.querySelector('.lbp')||{}).scrollTop|0;e.hidden=false;const ppl=frPeople(),fr=ppl.filter(p=>p.fr),rc=ppl.filter(p=>!p.fr);

{const pn=e.querySelector('.lbp');if(pn)pn.scrollTop=sc0}

async function frClick(ev){const tg=ev.target,x=t(),q=s=>tg.closest&&tg.closest(s);

let b;

if(b=q('[data-pp]')){const to=pingFor;pingFor=null;openFr();let r;try{r=await postJ('/api/invite',{from:pid,name:myName(),av:myAv(),to:[to],kind:'ping',ping:b.dataset.pp})}catch(e){toast(x.lbNoSrv);return}
const j=r.j||{};toast((j.limited||[]).length?'⏳ '+x.invLimited:((j.delivered||[]).length?'🟢 ':(j.pushed||[]).length?'🔔 ':'🔘 ')+b.dataset.pp);return}

/* ===== push notifications (Android app only; the web build skips all of this) ===== */
const PUSH=NA&&typeof Native.pushSupported==='function'&&!!Native.pushSupported();
async function pushRegister(){if(!PUSH)return;let tok='';try{tok=String(Native.getPushToken()||'')}catch(e){}
if(tok.length<20)return;let last='',at=0;try{last=localStorage.getItem('dm_ptok')||'';at=+localStorage.getItem('dm_ptat')||0}catch(e){}
if(tok===last&&Date.now()-at<864e5)return;
try{const r=await postJ('/api/push-token',{playerId:pid,token:tok});if(r.ok)try{localStorage.setItem('dm_ptok',tok);localStorage.setItem('dm_ptat',String(Date.now()))}catch(e){}}catch(e){}}
window.onPushToken=()=>{pushRegister()};
const pushOn=()=>{try{return PUSH&&!!Native.pushPermission()}catch(e){return false}};
window.onPushPerm=g=>{toast(g?t().pushOk:t().pushNo);if(g)pushRegister();if(frOpen())openFr()};
window.onPushOpen=j=>{let d=j;try{if(typeof j==='string')d=JSON.parse(j)}catch(e){return}if(!d)return;
if(d.kind==='invite'&&d.room){if(d.iid&&!inGame){invReply(d.iid,true);hideInvite(d.iid)}joinInvite(d.room)}else if(d.kind==='ping')showInvite({kind:'ping',name:d.name,ping:d.ping})};
window.onPushMsg=j=>{let d=j;try{if(typeof j==='string')d=JSON.parse(j)}catch(e){return}if(!d)return;if(d.kind==='cancel'){if(d.iid)hideInvite(d.iid);return}if(d.kind==='invite'||d.kind==='ping')showInvite(d)};

/*sd129-eco*/
/* economy state: XP, daily box timer, owned exclusive avatars, solo entry fee. Kept apart from dm_set so the server profile sync is untouched. */
const ECK='dm_eco',FRK='dm_friends',BOX_MS=864e5,XP_LV=200,VIP_FROM=12,VIP_N=4;
let eco={boxAt:0,xp:0,vip:[],opened:0,ss:0};
try{const o=JSON.parse(localStorage.getItem(ECK)||'{}');if(o&&typeof o==='object'){eco.boxAt=+o.boxAt||0;eco.xp=Math.max(0,+o.xp||0);eco.vip=Array.isArray(o.vip)?o.vip.filter(v=>Number.isInteger(v)&&v>=VIP_FROM&&v<VIP_FROM+VIP_N):[];eco.opened=+o.opened||0;eco.ss=[0,100,500,1000,5000].includes(+o.ss)?+o.ss:0}}catch(e){}
const saveEco=()=>{try{localStorage.setItem(ECK,JSON.stringify(eco))}catch(e){}};
const ecoLvl=()=>Math.floor(eco.xp/XP_LV)+1;
function ecoXp(n){eco.xp+=n|0;saveEco()}
let soloStake=eco.ss;
const boxReady=()=>Date.now()-eco.boxAt>=BOX_MS;
const boxLeft=()=>Math.max(0,Math.min(BOX_MS,BOX_MS-(Date.now()-eco.boxAt)));
const fmtHMS=ms=>{const s=Math.ceil(ms/1000);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')};
function rnd01(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
const BOX_TABLE=[{w:28,t:'c',v:250},{w:22,t:'c',v:500},{w:12,t:'c',v:1000},{w:4,t:'c',v:2500},{w:14,t:'x',v:50},{w:10,t:'x',v:150},{w:6,t:'x',v:300},{w:4,t:'v',v:0}];
function rollBox(){let r=rnd01()*100,e=BOX_TABLE[0];for(const b of BOX_TABLE){if(r<b.w){e=b;break}r-=b.w}
if(e.t==='v'){const free=[0,1,2,3].map(k=>VIP_FROM+k).filter(k=>!eco.vip.includes(k));if(!free.length)return{t:'c',v:1500,dup:true};return{t:'v',v:free[Math.floor(rnd01()*free.length)]}}
return{t:e.t,v:e.v}}
function applyBox(r){if(r.t==='c'){coins+=r.v;saveSet()}else if(r.t==='x')ecoXp(r.v);else if(r.t==='v'){eco.vip.push(r.v);saveEco()}}
/* the timer starts BEFORE the animation so closing the app mid-animation cannot be used to re-roll */
function claimBox(){if(!boxReady())return null;eco.boxAt=Date.now();eco.opened++;const r=rollBox();applyBox(r);saveEco();return r}
let mbTm=0;
function mbEl(){let e=document.getElementById('mbx');if(!e){e=document.createElement('div');e.id='mbx';e.hidden=true;document.body.appendChild(e);e.addEventListener('click',ev=>{if(ev.target.id==='mbclose'||ev.target===e)closeBox()})}return e}
function closeBox(){clearInterval(mbTm);const e=document.getElementById('mbx');if(e)e.hidden=true;if(inMenu)menuUI()}
function openBox(){const x=t(),e=mbEl();e.hidden=false;clearInterval(mbTm);
if(!boxReady()){e.innerHTML=`<div class="mbp"><h3>🎁 ${x.boxTitle}</h3><div class="mbi lock">🎁</div><p class="mbt">${x.boxCome}<br><b id="mbc">${fmtHMS(boxLeft())}</b></p><button class="big alt" id="mbclose">${x.upOk}</button></div>`;
mbTm=setInterval(()=>{const c=document.getElementById('mbc');if(!c){clearInterval(mbTm);return}if(boxReady()){clearInterval(mbTm);openBox();return}c.textContent=fmtHMS(boxLeft())},1000);return}
e.innerHTML=`<div class="mbp"><h3>🎁 ${x.boxTitle}</h3><div class="mbi ready" id="mbb">🎁</div><p class="mbt">${x.boxTap}</p></div>`;
const b=document.getElementById('mbb');let busy=false;
b.onclick=()=>{if(busy)return;busy=true;const r=claimBox();if(!r){openBox();return}
b.classList.remove('ready');b.classList.add('shake');try{[0,.12,.24,.36,.48,.6,.72].forEach(w=>tone(160+w*200,.06,'square',w))}catch(er){}
setTimeout(()=>{b.classList.remove('shake');b.classList.add('pop');setTimeout(()=>showBoxReward(r),420)},900)}}
function showBoxReward(r){const x=t(),e=mbEl();
const sp=Array.from({length:16},(_,i)=>`<i class="sp" style="--a:${i*22.5}deg;--d:${80+(i%3)*24}px;animation-delay:${(i%4)*.06}s"></i>`).join('');
let ic,line,sub='';
if(r.t==='c'){ic='🪙';line=`+<span id="mbn">0</span> ${x.boxCoins}`;if(r.dup)sub=x.boxDup}
else if(r.t==='x'){ic='⭐';line=`+<span id="mbn">0</span> ${x.boxXp}`}
else{ic=`<img class="avi big" src="${streetUri(r.v)}" alt="">`;line=x.boxVip}
e.innerHTML=`<div class="mbp rw"><div class="vh"><div class="spk">${sp}</div><div class="mbic">${ic}</div></div><p class="mbt">${x.boxWon}</p><div class="mbv">${line}</div>${sub?`<p class="mbs">${esc(sub)}</p>`:''}<div class="mbbal">🪙 ${coins.toLocaleString()} · ⭐ ${x.lvlL} ${ecoLvl()}</div><button class="big" id="mbclose">${x.upOk}</button></div>`;
try{snd.win()}catch(er){}if(r.t!=='v')countUp('mbn',r.v,900);if(inMenu)menuUI()}

/* leaderboard: Friends works with the existing /api/profile; Daily/Weekly/Global read GET /api/leaderboard?scope=daily|weekly|global
   -> {entries:[{playerId,name,avatar,rankPoints,wins}]} (server side still to be added) */
let lbTab='global';
const lbNum=v=>Math.max(0,+v||0);
const lbNorm=e=>({id:String(e.playerId||''),name:String(e.name||'Player'),av:e.avatar?esc(e.avatar):'🙂',rp:lbNum(e.rankPoints),w:lbNum(e.wins!==undefined?e.wins:e.totalWins)});
const lbMe=()=>({id:pid,name:myName(),av:null,rp:stats.rk|0,w:stats.mw|0,me:true});
const lbSort=a=>a.sort((p,q)=>q.rp-p.rp||q.w-p.w||p.name.localeCompare(q.name));
const lbFriends=()=>{try{const a=JSON.parse(localStorage.getItem(FRK)||'[]');return Array.isArray(a)?a.filter(v=>/^usr_[a-z0-9]{4,20}$/.test(v)).slice(0,30):[]}catch(e){return[]}};
const lbSaveFriends=a=>{try{localStorage.setItem(FRK,JSON.stringify(a.slice(0,30)))}catch(e){}};
function lbRowsHtml(rows,x){return rows.map((r,i)=>{const pos=r.pos||['🥇','🥈','🥉'][i]||('#'+(i+1));return`<div class="lbr${r.me?' me':''}"><span class="rk">${pos}</span><span class="la">${r.me?avBig():r.av}</span><span class="ln">${esc(r.name)}${dupTag(r,rows)}${r.me&&prof2.cc?' '+flagEmoji(prof2.cc):''}${r.me?' · '+x.lbYou:''}${r.off?' ·  ⚠':''}</span><span class="lp"><b>${r.rp}</b><small>🏆 ${r.w}</small></span>${r.fr?`<i class="lbx" data-lbrm="${esc(r.id)}">✕</i>`:''}</div>`}).join('')}
async function friendRows(){const ids=lbFriends();return Promise.all(ids.map(async id=>{try{const r=await api2('/api/profile?playerId='+encodeURIComponent(id));const p=r.ok&&r.j&&r.j.profile;if(p&&p.playerId===id){const o=lbNorm(p);o.fr=true;return o}}catch(e){}return{id,name:id,av:'👤',rp:0,w:0,off:true,fr:true}}))}
async function addFriend(raw){const x=t(),id=String(raw||'').trim().toLowerCase();if(!/^usr_[a-z0-9]{4,20}$/.test(id)||id===pid)return x.lbNF;const f=lbFriends();if(f.includes(id))return'';
try{const r=await api2('/api/profile?playerId='+encodeURIComponent(id));if(!r.ok||!r.j||!r.j.profile||r.j.exists===false)return x.lbNF}catch(e){}
f.push(id);lbSaveFriends(f);return''}
function lbEl(){let e=document.getElementById('lbm');if(!e){e=document.createElement('div');e.id='lbm';e.hidden=true;document.body.appendChild(e);
e.addEventListener('click',async ev=>{const tg=ev.target,x=t();if(tg===e||tg.id==='lbclose'){closeLb();return}
const tb=tg.closest&&tg.closest('[data-lbt]');if(tb){loadLb(tb.dataset.lbt);return}
const rm=tg.closest&&tg.closest('[data-lbrm]');if(rm){lbSaveFriends(lbFriends().filter(v=>v!==rm.dataset.lbrm));loadLb('friends');return}
if(tg.id==='lbcp'){const ok=await copyText(pid);tg.textContent=ok?x.lbCopied:pid;setTimeout(()=>{if(tg.isConnected)tg.textContent=x.lbCopy},1500);return}
if(tg.id==='lbad'){const inp=document.getElementById('lbin'),msg=await addFriend(inp&&inp.value);if(msg){const m=document.getElementById('lbms');if(m)m.textContent=msg}else loadLb('friends')}})}return e}
function closeLb(){const e=document.getElementById('lbm');if(e)e.hidden=true}
function openLb(){const x=t(),e=lbEl();e.hidden=false;
e.innerHTML=`<div class="lbp"><div class="lbh"><h3>🏆 ${x.mLb}</h3><button class="sm" id="lbclose">✕</button></div><div class="lbt">${[['daily',x.lbDaily],['weekly',x.lbWeekly],['friends',x.lbFriends],['global',x.lbGlobal]].map(([k,n])=>`<b data-lbt="${k}">${n}</b>`).join('')}</div><div id="lbbody"></div></div>`;loadLb(lbTab)}
async function loadLb(tab){const x=t(),body=document.getElementById('lbbody');if(!body)return;lbTab=tab;
document.querySelectorAll('#lbm [data-lbt]').forEach(b=>b.classList.toggle('on',b.dataset.lbt===tab));
body.innerHTML=`<p class="lbn">${x.lbLoad}</p>`;let rows=[],note='';
if(tab==='friends'){rows=await friendRows();rows.push(lbMe());lbSort(rows)}
else{try{const r=await api2('/api/leaderboard?scope='+tab+'&limit=50');if(r.ok&&r.j&&Array.isArray(r.j.entries)){rows=r.j.entries.map(lbNorm);const mi=rows.findIndex(o=>o.id===pid);if(mi>=0)rows[mi].me=true;else{const m=lbMe();m.pos='—';rows.push(m)}}else note=x.lbNoSrv}catch(e){note=x.lbNoSrv}
if(note)rows=[lbMe()]}
if(lbTab!==tab)return;
let h=note?`<p class="lbn">${note}</p>`:'';h+=lbRowsHtml(rows,x);
if(tab==='friends'){h+=`<div class="lbf"><input id="lbin" class="pni" maxlength="24" placeholder="${x.lbAddPh}" autocapitalize="none"><button class="sm" id="lbad">${x.lbAdd}</button></div><p class="lbn" id="lbms">${lbFriends().length?'':x.lbNoFr}</p><div class="lbid">${x.lbMyId}: <b>${esc(pid)}</b> <button class="sm" id="lbcp">${x.lbCopy}</button></div>`}
body.innerHTML=h}

/* solo entry fee: the existing coins-match settlement (pot split among the winning team) does the rest */
function soloDlg(){const x=t();if(soloStake>coins)soloStake=0;
const chips=[0,100,500,1000,5000].map(v=>`<b data-sst="${v}" class="${soloStake===v?'on':''}${v>coins?' dis2':''}">${v?'🪙 '+v.toLocaleString():x.ssFree}</b>`).join('');
upShow(`<h3>${x.chm}</h3><label class="sdl">${x.ssT} · ${x.bal}: 🪙 ${coins.toLocaleString()}</label><div class="sw chips">${chips}</div><button class="big" id="s11">🤖 ${x.sBot11}</button><button class="big" id="s22">🤖 ${x.sBot22}</button><button class="big" id="spp">👥 ${x.sPP}</button><button class="big alt" id="upx">${x.mBack}</button>`)}
function menuHTML(){const x=t(),rdy=boxReady(),fl=prof2.cc?flagEmoji(prof2.cc):'';
return`<div class="mhd"><div class="pcard2" id="pc"><span class="av2">${avBig()}</span><div class="pid"><div class="pn"><b>${esc(myName())}</b>${fl?`<span class="fl">${fl}</span>`:''}</div><em class="ttl2">${titleOf(stats.mw,lang)}</em></div></div><div class="wal"><div class="chip2"><b>🪙 ${coins.toLocaleString()}</b><small>${x.coinsL}</small></div><div class="chip2"><b>🏆 ${stats.rk|0}</b><small>${x.rkL}</small></div><div class="chip2"><b>⭐ ${ecoLvl()}</b><small>${x.xpL} ${eco.xp%XP_LV}/${XP_LV}</small></div></div></div><button class="big" data-m="solo">🤖 ${x.mSolo}</button><button class="big alt" data-m="lan">📡 ${x.mLan}</button><button class="big alt" data-m="online">🌐 ${x.mOnline}</button><div class="row2"><button class="big alt bx${rdy?' ready':''}" data-m="box">🎁 ${x.mBox}<span class="sub" id="bxc">${rdy?x.mBoxReady:fmtHMS(boxLeft())}</span></button><button class="big alt" data-m="lb">🏆 ${x.mLb}</button></div><button class="big alt" data-m="fr">👥 ${x.mFr}<span class="sub" id="frc">${Pres.onlineText()}</span></button>`}
function menuUI(){$('menu').innerHTML=menuHTML()}
function streetGrid(){const n=STREET_SPECS.length+VIP_N;return Array.from({length:n},(_,k)=>{const vip=k>=STREET_SPECS.length,own=!vip||eco.vip.includes(k);return`<b ${own?`data-sav="${k}"`:'data-lock="1"'} class="${prof2.k==='street'&&prof2.s===k?'on':''}${vip?' vip':''}${own?'':' lk'}"><img class="avi" src="${streetUri(k)}" alt="">${own?'':'<i class="lki">🔒</i>'}</b>`}).join('')}
function profExtras(x){const lv=ecoLvl(),xp=eco.xp%XP_LV;return`<div class="sdl">⭐ ${x.lvlL} ${lv} · ${xp}/${XP_LV} ${x.xpL}</div><div class="bar"><i style="width:${xp*100/XP_LV}%;background:var(--ac)"></i></div>${CAN_PHOTO?`<div class="sdl">${x.pfPhoto}</div><div class="sw chips"><b id="phb">📷 ${x.pfUpload}</b>${photo?`<b id="phx">🗑 ${x.pfRemove}</b>`:''}</div><input type="file" id="phf" accept="image/*" hidden>`:''}<div class="sdl">${x.pfStreet}</div><div class="sw chips ag sdg">${streetGrid()}</div><div class="sdl">${x.pfCountry}</div><select id="pcc" class="pni"><option value="">🌍 ${x.pfNone}</option>${ccOptions()}</select>`}

/* Street avatars: procedural SVG (no image files). spec = [bg, skin, hair, accessory] */
const STREET_SPECS=[
 ['#e11d2e','#f1c27d','#1a1a1a','capback'],['#2b2b33','#8d5524','#0d0d0d','shades'],['#f4f4f5','#c68642','#111','beanie'],
 ['#5b1018','#ffdbac','#3b2314','hood'],['#33333d','#e0ac69','#1a1a1a','phones'],['#2b2b33','#6f4423','#0d0d0d','bandana'],
 ['#1d1d24','#f1c27d','#d9d9de','mohawk'],['#f4f4f5','#8d5524','#111','afro'],['#7a0b14','#c68642','#222','durag'],
 ['#2b2b33','#ffdbac','#e11d2e','spikes'],['#e11d2e','#e0ac69','#111','snap'],['#1d1d24','#6f4423','#0d0d0d','chain']];
function streetSvg(i){const [bg,sk,hr,ac]=STREET_SPECS[i%STREET_SPECS.length];
 const eyes=ac==='shades'?`<rect x="19" y="27" width="11" height="6" rx="2" fill="#111"/><rect x="34" y="27" width="11" height="6" rx="2" fill="#111"/><rect x="29" y="29" width="6" height="2" fill="#111"/>`:`<circle cx="25" cy="30" r="2.2" fill="#111"/><circle cx="39" cy="30" r="2.2" fill="#111"/>`;
 const A={
  capback:`<path d="M15 25a17 15 0 0 1 34 0z" fill="#e11d2e"/><rect x="11" y="24" width="14" height="4" rx="2" fill="#a30f1d"/>`,
  shades:`<path d="M16 24a16 13 0 0 1 32 0z" fill="${hr}"/>`,
  beanie:`<path d="M14 26a18 17 0 0 1 36 0z" fill="#e11d2e"/><rect x="13" y="24" width="38" height="5" rx="2.5" fill="#f4f4f5"/>`,

  bandana:`<path d="M15 26a17 14 0 0 1 34 0z" fill="#e11d2e"/><path d="M48 24l7 4-7 3z" fill="#e11d2e"/>`,
  mohawk:`<path d="M28 12l4-8 4 8v14h-8z" fill="${hr}"/>`,
  afro:`<circle cx="32" cy="22" r="19" fill="${hr}"/>`,
  durag:`<path d="M15 27a17 15 0 0 1 34 0z" fill="#1d1d24"/><path d="M15 27l-8 8 9-2z" fill="#1d1d24"/>`,
  spikes:`<path d="M17 25l3-10 5 7 4-11 4 11 5-7 3 10z" fill="${hr}"/>`,
  snap:`<path d="M15 25a17 14 0 0 1 34 0z" fill="#1d1d24"/><rect x="14" y="23" width="36" height="4" rx="2" fill="#f4f4f5"/><rect x="38" y="25" width="16" height="4" rx="2" fill="#f4f4f5"/>`,
  chain:`<path d="M16 24a16 13 0 0 1 32 0z" fill="${hr}"/>`}[ac];
 const body=ac==='hood'?'':`<path d="M8 64c0-13 11-18 24-18s24 5 24 18z" fill="${ac==='chain'?'#f4f4f5':'#1d1d24'}"/>`;
 const chain=ac==='chain'?`<path d="M22 50q10 9 20 0" fill="none" stroke="#e11d2e" stroke-width="2.5" stroke-dasharray="3 2"/>`:'';
 const head=ac==='hood'?'':`<ellipse cx="32" cy="33" rx="15" ry="17" fill="${sk}"/>`;
 const back=ac==='afro'||ac==='hood'?A:'';const front=ac==='afro'||ac==='hood'?'':A;
 const hoodTop=ac==='hood'?`<path d="M14 30a18 17 0 0 1 36 0c-4-6-10-9-18-9s-14 3-18 9z" fill="#1d1d24"/>`:'';
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="${bg}"/>${back.includes('circle')?back:''}${body}${ac==='hood'?A.split('<ellipse')[0]:''}${head}${ac==='hood'?'<ellipse cx="32" cy="33" rx="15" ry="17" fill="'+sk+'"/>':''}${eyes}<path d="M26 40q6 5 12 0" fill="none" stroke="#3a1f0f" stroke-width="2" stroke-linecap="round"/>${hoodTop}${front}${chain}</svg>`}

const flagEmoji=c=>CC.includes(c)?String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0))):'';
const P2K='dm_prof2',PHK='dm_photo';
let prof2={k:'street',s:0,cc:''},photo='';
try{const o=JSON.parse(localStorage.getItem(P2K)||'{}');if(o&&typeof o==='object'){prof2.k=o.k==='photo'?'photo':'street';prof2.s=o.k==='street'?(+o.s||0):((avs[0]|0)%STREET_SPECS.length);if(prof2.s>=STREET_SPECS.length&&!eco.vip.includes(prof2.s))prof2.s=0;prof2.cc=CC.includes(o.cc)?o.cc:''}else prof2.s=(avs[0]|0)%STREET_SPECS.length}catch(e){}

/* the photo button needs a WebView file chooser; in the APK it appears only when the native side declares support */
const CAN_PHOTO=!NA||(typeof Native.supportsFilePicker==='function'&&!!Native.supportsFilePicker());
const meSeat=()=>net.client&&typeof net.own==='number'?net.own:0;
const myImg=()=>prof2.k==='photo'&&photo?photo:prof2.k==='street'?streetUri(prof2.s):'';

const flagOf=p=>p===meSeat()&&prof2.cc?' '+flagEmoji(prof2.cc):'';
const squareCrop=(w,h)=>{const m=Math.min(w,h);return{sx:(w-m)/2,sy:(h-m)/2,m}};
function readPhoto(f){const bad=()=>{const x=t();upShow(`<h3>📷</h3><p>${x.pfPhotoErr}</p><button class="big" id="upx">${x.upOk}</button>`)};
if(!f||!/^image\//.test(f.type||'')){bad();return}
const url=URL.createObjectURL(f),img=new Image();
img.onload=()=>{let ok=false;try{const S=250,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),r=squareCrop(img.naturalWidth,img.naturalHeight);g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(img,r.sx,r.sy,r.m,r.m,0,0,S,S);const d=c.toDataURL('image/jpeg',.82);
if(/^data:image\/jpeg;base64,/.test(d)){localStorage.setItem(PHK,d);photo=d;prof2.k='photo';saveProf2();ok=true}}catch(e){}

$('ft').textContent=CR;
$('cmr').onclick=e=>{const b=e.target.closest('b');if(!b)return;const d=b.dataset;if(d.cm!==undefined){stake=+d.cm?(stake||500):0;coinsRules()}else if(d.st)stake=+d.st;render();net.lobby()};
$('gmr').onclick=e=>{const b=e.target.closest('b');if(b)setGM(b.dataset.gm)};
$('sR').onclick=e=>{const y=e.target.closest('[data-y]');if(!y||over>=0||dealing)return;const i=+y.dataset.y;if(!yard[i]||playable(cur).length||seat[cur]!==1||!shown)return;if(net.client)net.send({t:'draw',i});else doDraw(cur,i)};
$('bk').onclick=()=>{if(net.host||net.client)setMode(0);inMenu=true;render()};
$('nt').onclick=e=>{const b=e.target.closest('b');if(b)setMode(+b.dataset.nm)};
$('lan').onclick=e=>{if(onlineClick(e.target.id))return;if(e.target.id==='jc'){const ip=$('hip').value.trim();if(!ip)return;net.last=ip;net.msg='\u2026';names[0]=myName();avs[0]=myAv();net.myname=myName();net.bk={names:[...names],avs:[...avs]};net.client=true;Native.connect('ws://'+ip+':'+net.port);render()}};
$('upp').onclick=e=>{const kb=e.target.closest('[data-k]');if(kb){sendRx(kb.dataset.k);$('up').hidden=true;return}const id=e.target.id;if(id==='upx')$('up').hidden=true;else if(id==='s11'||id==='s22'){$('up').hidden=true;gm=id==='s11'?'1v1':'2v2';seat=gm==='1v1'?[1,0,2,0]:[1,2,2,2];stake=soloStake;if(newMatch())startRound();else stake=0}else if(id==='spp'){$('up').hidden=true;gm='1v1';stake=0;seat=[1,0,1,0];if(/^Player \d$/.test(names[2]))names[2]='Player 2';newMatch();startRound()}else if(id==='qy'){$('up').hidden=true;toMenu()}else if(id==='qn')$('up').hidden=true;else if(id==='upgo'){const u=e.target.dataset.u;$('upp').innerHTML=`<h3>${t().upDl}</h3><h2 id="upb">0%</h2>`;Native.installUpdate(u)}};
/*sd131-boot*/
net.lp=net.lp||{};
(function(){
/* online options + chat + invite plumbing */
$('lan').addEventListener('click',e=>{const q=s=>e.target.closest&&e.target.closest(s);let b;
if(b=q('[data-otm]')){onlineTurn=+b.dataset.otm;render();return}
if(b=q('[data-oau]')){onlineAuto=AUTOS.includes(b.dataset.oau)?b.dataset.oau:'manual';render();return}
if(b=q('[data-oty]')){if(b.dataset.oty==='coins'&&coins<100)return;onlineType=b.dataset.oty==='coins'?'coins':'casual';if(onlineType==='casual')onlineStake=0;else if(!onlineStake)onlineStake=coins>=500?500:100;render();return}
if(b=q('[data-osp]')){speedOpen=!speedOpen;render()}});
$('upp').addEventListener('click',e=>{if(e.target.id==='rxs'){const i=$('rxi');if(i&&sendTxt(i.value))$('up').hidden=true}});
$('upp').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rxi'){e.preventDefault();if(sendTxt(e.target.value))$('up').hidden=true}});
/* language button (top left, hidden during a match) */
const top=document.querySelector('.top');
if(top){const b=document.createElement('button');b.id='lgb';b.className='sm lgb';b.setAttribute('aria-label','Language');b.textContent='🌐';top.insertBefore(b,top.firstChild);
const pop=document.createElement('div');pop.id='lgp';pop.hidden=true;document.body.appendChild(pop);
b.addEventListener('click',e=>{e.stopPropagation();if(!pop.hidden){pop.hidden=true;return}pop.innerHTML=LG.map(l=>`<b data-l2="${l}" class="${l===lang?'on':''}">${LGN[l]}</b>`).join('');pop.hidden=false});
pop.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('[data-l2]');if(!c)return;pop.hidden=true;setLangTo(c.dataset.l2)});
document.addEventListener('click',e=>{if(!pop.hidden&&e.target!==b)pop.hidden=true});
const _r=render;render=function(){_r.apply(this,arguments);b.style.display=inGame?'none':''}}
/* turn countdown on the active player's HUD (server time left, online games) */
setInterval(()=>{const a=document.querySelector('.pb.act');if(!a)return;
if(!net.tl||!net.online){a.removeAttribute('data-cd');return}
const left=Math.max(0,net.tl.ms-(Date.now()-net.tl.at));a.setAttribute('data-cd',Math.ceil(left/1000));a.classList.toggle('urgent',left<5000)},250);
/* voice: show whether each player's audio is really connected, warn when the network blocks it */
let vcWarned=false;
setInterval(()=>{if(!Voice.on){vcWarned=false;return}
document.querySelectorAll('[data-mic]').forEach(b=>{const p=+b.dataset.mic;if(p===net.own)return;const c=Voice.peers.get(p),s=c?c.pc.iceConnectionState:'';
b.dataset.vs=(s==='connected'||s==='completed')?'ok':(s==='failed'||s==='disconnected')?'bad':c?'wait':''});
for(const c of Voice.peers.values())if(c.pc.iceConnectionState==='failed'&&!vcWarned){vcWarned=true;toast(window.SDVoice&&SDVoice.hasRelay()?t().vcFail2:t().vcFail)}},1500);
/* presence + push */
Pres.connect();setInterval(()=>Pres.sync(false),2000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){Pres.want=false;try{Pres.ws&&Pres.ws.close()}catch(e){}}else{Pres.want=true;Pres.bo=0;Pres.connect()}});
setTimeout(pushRegister,4000);
})();
/*sd130-boot*/
$('lan').addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('[data-ost]');if(!c)return;const v=+c.dataset.ost;if(v>coins)return;onlineStake=v;render()});
/*sd129-boot*/
(function(){
const prevBack=window.onBackPress;
window.onBackPress=()=>{const m=document.getElementById('mbx'),l=document.getElementById('lbm');
if(m&&!m.hidden){closeBox();return true}if(l&&!l.hidden){closeLb();return true}return prevBack?prevBack():false};
$('upp').addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('[data-sst]');if(!c)return;const v=+c.dataset.sst;if(v>coins)return;soloStake=v;eco.ss=v;saveEco();soloDlg()});
$('pp').addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-lock]')){const x=t();upShow(`<h3>🔒</h3><p>${x.vipLock}</p><button class="big" id="upx">${x.upOk}</button>`)}});
setInterval(()=>{if(!inMenu||inGame)return;const c=document.getElementById('bxc');if(!c)return;const rdy=boxReady(),was=c.parentNode.classList.contains('ready');if(rdy!==was){menuUI();return}c.textContent=rdy?t().mBoxReady:fmtHMS(boxLeft())},1000)})();
/*sd127-boot*/
if(!String(names[0]||'').trim())names[0]=myName();
(function(){const pp=$('pp');
pp.addEventListener('click',e=>{const t0=e.target,cl=s=>t0.closest&&t0.closest(s);
if(cl('[data-pav]')){prof2.k='emoji';saveProf2();ProfileModal();render();return}
const sv=cl('[data-sav]');if(sv){prof2.k='street';{const k0=+sv.dataset.sav||0;prof2.s=(k0<STREET_SPECS.length||eco.vip.includes(k0))?k0:0};saveProf2();ProfileModal();render();return}
if(t0.id==='phb'){const f=$('phf');if(f)f.click();return}
if(t0.id==='phx'){try{localStorage.removeItem(PHK)}catch(x){}photo='';if(prof2.k==='photo')prof2.k='emoji';saveProf2();ProfileModal();render()}});
pp.addEventListener('change',e=>{const t0=e.target;
if(t0.id==='phf'){const f=t0.files&&t0.files[0];t0.value='';if(f)readPhoto(f);return}
if(t0.id==='pcc'){const v=String(t0.value||'');prof2.cc=CC.includes(v)?v:'';saveProf2();render();return}
if(t0.id==='pn2'&&!t0.value.trim()){names[0]=guestName();t0.value=names[0];saveSet();render()}})})();
applyTheme();render();setTimeout(syncProfile,600);
/*sd126-boot*/
(function(){let c='';try{c=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)}catch(e){}
if(!c)return;
try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
const go=()=>{inMenu=false;setMode(3);net.lastc=c;net.oph='room';net.ol=null;net.msg='';onlineConnect({room:c});render()};
const n=(names[0]||'').trim();
if(n&&!/^Player \d$/.test(n)){go();return}
const guest='Guest '+(1000+Math.floor(Math.random()*9000)),x=t();
upShow(`<h3>🎲 ${x.invJoin} <b>${esc(c)}</b></h3><label style="display:block;margin:8px 0;color:var(--mu)">${x.invName}</label><input id="gn" maxlength="12" value="${guest}" style="width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:#0e121b;color:#fff;font-size:18px;text-align:center"><button class="big" id="gj">${x.invGo}</button>`);
$('upp').addEventListener('click',function h(e){if(e.target.id!=='gj')return;const v=(($('gn')||{}).value||'').trim().slice(0,12)||guest;names[0]=v;saveSet();$('up').hidden=true;$('upp').removeEventListener('click',h);go()});
})();
const spl=$('splash');spl.onclick=()=>spl.classList.add('out');
setTimeout(()=>{spl.classList.add('out');setTimeout(()=>spl.remove(),700);if(NA)Native.checkUpdate('auto')},2800);
</script></body></html>
