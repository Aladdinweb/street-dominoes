else if(b.dataset.rx){rxMenu();return}
else if(b.dataset.sb){showScore();return}
else if(b.dataset.set){setPanel();$('set').hidden=false;return}
else if(b.dataset.mute)mute=!mute;
else if(b.dataset.menu){gid++;inGame=false}
render()};
$('sp').onclick=e=>{const i=e.target.closest('i'),b=e.target.closest('b'),th=e.target.closest('.th');
if(i){if(i.parentNode.dataset.k==='tc')tcol=+i.dataset.i;else scol=+i.dataset.i;applyTheme();saveSet();setPanel()}
else if(th){tcol=+th.dataset.ti;applyTheme();saveSet();setPanel()}
else if(b){const d=b.dataset;if(d.lg){lang=d.lg;try{localStorage.setItem('dm_lang',lang)}catch(x){}}else if(d.mt)mute=!mute;else if(d.tg)target=+d.tg;else if(d.av!==undefined)avs[0]=+d.av;saveSet();setPanel();render()}
else if(e.target.id==='sm'){$('set').hidden=true;askQuit()}
else if(e.target.id==='op'){$('set').hidden=true;ProfileModal()}else if(e.target.id==='uc')Native.checkUpdate('manual');else if(e.target.id==='sx')$('set').hidden=true};
$('rs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=b.dataset.r;$('res').hidden=true;if(r==='go')startRound();else if(r==='re'){if(newMatch())startRound()}else if(r==='orm')net.send({t:'rematch'});else toMenu()};
$('sp').oninput=e=>{if(e.target.id==='pn'){names[0]=e.target.value;saveSet();return}if(e.target.id==='vr'){vol=e.target.value/100;saveSet();tone(660,.1)}};
$('set').onclick=e=>{if(e.target.id==='set')$('set').hidden=true};
$('seats').oninput=e=>{const n=e.target.dataset.n;if(n!==undefined){names[+n]=e.target.value;saveSet()}};
$('menu').onclick=e=>{if(e.target.closest('#pc')){ProfileModal();return}const b=e.target.closest('button');if(!b)return;const m=b.dataset.m,x=t();
if(m==='solo')upShow(`<h3>${x.chm}</h3><button class="big" id="s11">🤖 ${x.sBot11}</button><button class="big" id="s22">🤖 ${x.sBot22}</button><button class="big" id="spp">👥 ${x.sPP}</button><button class="big alt" id="upx">${x.mBack}</button>`)
else if(m==='lan'){inMenu=false;if(NA)setMode(1);else render()}
else if(m==='online'){inMenu=false;setMode(3)}};
$('hand').addEventListener('pointerdown',dragStart);window.addEventListener('pointermove',dragMove);window.addEventListener('pointerup',e=>dragEnd(e,false));window.addEventListener('pointercancel',e=>dragEnd(e,true));
$('pp').onclick=e=>{const b=e.target.closest('[data-pav]');if(b){avs[0]=+b.dataset.pav;saveSet();ProfileModal();return}if(e.target.id==='pmx'){$('pm').hidden=true;render()}};
$('pp').oninput=e=>{if(e.target.id==='pn2'){names[0]=e.target.value;saveSet()}};
$('ovp').onclick=e=>{if(e.target.id==='bkc')bkNext()};
initSkins();
['sB','sT','sL','sR'].forEach(id=>$(id).addEventListener('click',micClick));
$('ft').textContent=CR;
$('cmr').onclick=e=>{const b=e.target.closest('b');if(!b)return;const d=b.dataset;if(d.cm!==undefined){stake=+d.cm?(stake||500):0;coinsRules()}else if(d.st)stake=+d.st;render();net.lobby()};
$('gmr').onclick=e=>{const b=e.target.closest('b');if(b)setGM(b.dataset.gm)};
$('sR').onclick=e=>{const y=e.target.closest('[data-y]');if(!y||over>=0||dealing)return;const i=+y.dataset.y;if(!yard[i]||playable(cur).length||seat[cur]!==1||!shown)return;if(net.client)net.send({t:'draw',i});else doDraw(cur,i)};
$('bk').onclick=()=>{if(net.host||net.client)setMode(0);inMenu=true;render()};
$('nt').onclick=e=>{const b=e.target.closest('b');if(b)setMode(+b.dataset.nm)};
$('lan').onclick=e=>{if(onlineClick(e.target.id))return;if(e.target.id==='jc'){const ip=$('hip').value.trim();if(!ip)return;net.last=ip;net.msg='\u2026';net.myname=(names[0]||'').trim()||'Player';net.bk={names:[...names],avs:[...avs]};net.client=true;Native.connect('ws://'+ip+':'+net.port);render()}};
$('upp').onclick=e=>{const kb=e.target.closest('[data-k]');if(kb){sendRx(kb.dataset.k);$('up').hidden=true;return}const id=e.target.id;if(id==='upx')$('up').hidden=true;else if(id==='s11'||id==='s22'){$('up').hidden=true;gm=id==='s11'?'1v1':'2v2';seat=gm==='1v1'?[1,0,2,0]:[1,2,2,2];stake=0;newMatch();startRound()}else if(id==='spp'){$('up').hidden=true;gm='1v1';stake=0;seat=[1,0,1,0];if(/^Player \d$/.test(names[2]))names[2]='Player 2';newMatch();startRound()}else if(id==='qy'){$('up').hidden=true;toMenu()}else if(id==='qn')$('up').hidden=true;else if(id==='upgo'){const u=e.target.dataset.u;$('upp').innerHTML=`<h3>${t().upDl}</h3><h2 id="upb">0%</h2>`;Native.installUpdate(u)}};
applyTheme();render();setTimeout(syncProfile,600);
const spl=$('splash');spl.onclick=()=>spl.classList.add('out');
setTimeout(()=>{spl.classList.add('out');setTimeout(()=>spl.remove(),700);if(NA)Native.checkUpdate('auto')},2800);
</script></body></html>
