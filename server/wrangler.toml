name = "street-dominoes-server"
main = "src/worker.js"
compatibility_date = "2026-03-01"

# Player profiles / stats (one write per finished match)
[[kv_namespaces]]
binding = "PLAYER_STATS"
id = "3192fd55450a41258c4d59964fc762a5"

# Online rooms + matchmaking
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Matchmaker"]
